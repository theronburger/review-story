name: Notice quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check affected notices
        if: github.event_name == 'pull_request'
        run: node cli.mjs --base HEAD^1
      - name: Audit the catalog
        if: github.event_name == 'workflow_dispatch'
        run: node cli.mjs --all
